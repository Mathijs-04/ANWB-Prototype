<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ANWB Activities</title>
  <meta name="description" content="Plan en doe mee aan activiteiten met je ANWB-collega's.">
  <meta name="theme-color" content="#003d86">
  <link rel="icon" type="image/png" href="assets/anwb-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Naar de inhoud</a>

  <header class="site-header" id="top">
    <div class="container site-header__inner">
      <a class="brand" href="#/" aria-label="ANWB Activities, naar overzicht">
        <img src="assets/anwb-logo.png" alt="ANWB" width="96" height="50">
        <span class="brand__name">Activities</span>
      </a>
      <nav class="main-nav" aria-label="Hoofdmenu">
        <a href="#/" data-nav="overview">Activiteiten</a>
        <a href="#/terugblik" data-nav="archive">Terugblik</a>
      </nav>
      <div class="header-actions">
        <button class="profile-btn" type="button" data-action="profile">
          <span class="profile-btn__avatar" data-profile-avatar aria-hidden="true"></span>
          <span class="profile-btn__label" data-profile-label>Wie ben jij?</span>
        </button>
        <a class="btn btn--primary btn--sm header-cta" href="#/nieuw">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
          Organiseer
        </a>
      </div>
    </div>
  </header>

  <main id="main" class="app" tabindex="-1"></main>

  <nav class="mobile-nav" aria-label="Menu">
    <a href="#/" data-nav="overview"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-calendar"/></svg>Activiteiten</a>
    <a href="#/terugblik" data-nav="archive"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-history"/></svg>Terugblik</a>
  </nav>

  <a class="fab" href="#/nieuw" aria-label="Organiseer een activiteit">
    <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
  </a>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <div class="site-footer__brand">
        <span class="site-footer__title">ANWB Activities</span>
        <span>Samen eropuit met collega's.</span>
      </div>
      <div class="site-footer__links">
        <a href="#/">Activiteiten</a>
        <a href="#/terugblik">Terugblik</a>
        <a href="#/nieuw">Organiseer</a>
        <button type="button" class="link-btn" data-action="reset">Demo resetten</button>
      </div>
    </div>
  </footer>

  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <!-- Icon sprite (stroke icons, 24px grid) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M17.5 14.8c2 .7 3.5 2.4 4 5.2"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 16.5V12l2-5.2A2 2 0 0 1 7.9 5.5h8.2a2 2 0 0 1 1.9 1.3L20 12v4.5"/><path d="M3 12h18v4.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M6 17.5V19.5M18 17.5V19.5"/><circle cx="7.5" cy="14.5" r=".6"/><circle cx="16.5" cy="14.5" r=".6"/></symbol>
      <symbol id="i-seat" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-3.8 3.4-6 7-6s6.3 2.2 7 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3.5 8.5a2 2 0 0 1 2-2h2.2l1.5-2h5.6l1.5 2h2.2a2 2 0 0 1 2 2v9.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M9.5 14.5l5-5M8 11l-2 2a3.5 3.5 0 0 0 5 5l2-2M16 13l2-2a3.5 3.5 0 0 0-5-5l-2 2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9L8.5 6H7M15 9l-3 7h-6"/></symbol>
      <symbol id="i-train" viewBox="0 0 24 24"><rect x="5.5" y="3.5" width="13" height="14" rx="3"/><path d="M5.5 11h13M9 21l1.5-3.5M15 21l-1.5-3.5"/><circle cx="9" cy="14.3" r=".6"/><circle cx="15" cy="14.3" r=".6"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9z"/><path d="M18.5 16v4M16.5 18h4"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="9.5" r="1.6"/><path d="M20.5 15.5l-5-5-9 9"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4.5v4h4"/><path d="M12 8v4.5l3 1.8"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    </defs>
  </svg>

  <script type="module" src="js/app.js"></script>
</body>
</html>
